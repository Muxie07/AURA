[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA — Autonomous AI Business Operations Engineer — Backend"
requires-python = ">=3.12"
dependencies = [ "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "python-multipart>=0.0.9", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.29.0", "alembic>=1.13.0", "pgvector>=0.3.6", "pydantic>=2.9.0", "pydantic-settings>=2.5.0", "python-dotenv>=1.0.0", "python-jose[cryptography]>=3.3.0", "passlib[bcrypt]>=1.7.4", "cryptography>=43.0.0", "structlog>=24.4.0", "rich>=13.9.0", "httpx>=0.27.0", "redis[hiredis]>=5.1.0", "aioredis>=2.0.0", "pypdf>=4.3.0", "python-docx>=1.1.2", "aiofiles>=24.1.0", "orjson>=3.10.0", "tenacity>=9.0.0", "python-slugify>=8.0.0", "arrow>=1.3.0", "openai>=1.51.0", "anthropic>=0.36.0", "google-genai>=0.4.0", "tiktoken>=0.8.0", "langchain-core>=0.3.0", "langgraph>=0.2.0", "mcp==1.29.0",]
[[project.authors]]
name = "AURA Contributors"

[project.optional-dependencies]
dev = [ "pytest>=8.3.0", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "pytest-httpx>=0.32.0", "httpx>=0.27.0", "anyio>=4.6.0", "factory-boy>=3.3.0", "faker>=30.0.0", "ruff>=0.6.0", "mypy>=1.11.0", "types-passlib>=1.7.7", "types-python-jose>=3.3.4", "pre-commit>=4.0.0", "aiosqlite>=0.20.0",]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [ "app", "tests",]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = [ "pydantic.mypy",]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PTH", "RUF",]
ignore = [ "E501", "B008", "ARG001",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = [ "tests",]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = [ "--tb=short", "--strict-markers", "-q",]
markers = [ "unit: fast isolated unit tests", "integration: tests requiring a running database", "slow: tests that take a long time",]

[tool.coverage.run]
source = [ "app",]
omit = [ "*/migrations/*", "*/tests/*", "*/__init__.py", "*/main.py",]

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", "def __repr__", "if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod",]

[tool.ruff.lint.isort]
known-first-party = [ "app",]

[tool.hatch.build.targets.wheel]
packages = [ "app",]
